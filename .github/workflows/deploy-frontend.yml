name: Build and Deploy Frontend to Cloudflare Pages

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy built frontend to Cloudflare Pages'
        required: true
        default: true
        type: boolean

jobs:
  build:
    name: Build & Verify Frontend
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: src/frontend/package.json

      - name: Validate Frontend Supabase Configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::Missing required GitHub Secret: VITE_SUPABASE_URL"
            exit 1
          fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing required GitHub Secret: VITE_SUPABASE_ANON_KEY"
            exit 1
          fi
          case "$VITE_SUPABASE_ANON_KEY" in
            sb_secret_*|ssb_secret_*)
              echo "::error::VITE_SUPABASE_ANON_KEY must be the public publishable/anon key, never a backend secret key."
              exit 1
              ;;
          esac
          echo "Frontend Supabase configuration validated (public key format)."

      - name: Install Frontend Dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Build Frontend Application
        working-directory: src/frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Validate Cloudflare Deployment Credentials
        if: (((github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.deploy))
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub Secret CLOUDFLARE_API_TOKEN. Configure it in Repository Settings -> Secrets and variables -> Actions."
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing GitHub Secret CLOUDFLARE_ACCOUNT_ID. Configure it in Repository Settings -> Secrets and variables -> Actions."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Cloudflare deployment credentials verified."

      - name: Deploy to Cloudflare Pages
        if: (((github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.deploy)) && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy src/frontend/dist --project-name=pricewise-lk
